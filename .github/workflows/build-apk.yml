name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract ZIP (If ZIP is uploaded)
        run: |
          # ZIP फाइल को खुद अनज़िप करेगा
          if compgen -G "*.zip" > /dev/null; then
            echo "Extracting archive..."
            unzip -o *.zip || true
          fi

          # अगर फाइल्स किसी सब-फोल्डर में अनज़िप हुई हैं, तो मेन में ले आएगा
          if [ ! -f "package.json" ]; then
            SUB_DIR=$(find . -maxdepth 3 -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$SUB_DIR" ] && [ "$SUB_DIR" != "." ]; then
              echo "Relocating files from $SUB_DIR to root..."
              cp -r "$SUB_DIR"/* .
            fi
          fi

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Bundle Web Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/ || true

      - name: Setup Official Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace || (gradle wrapper && chmod +x gradlew && ./gradlew assembleDebug --no-daemon)

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Yesmin-AI-GalaxyTab-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
