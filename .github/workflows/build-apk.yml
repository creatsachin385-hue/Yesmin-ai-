name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # मैन्युअल 'Run' बटन के लिए

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip Uploaded ZIP File
        run: |
          # रिपॉजिटरी में मौजूद ZIP फाइल को खुद अनज़िप करेगा
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting $f..."
              unzip -o "$f"
            fi
          done

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: |
          npm run build

      - name: Initialize Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "Yesmin AI" "com.yesmin.ai.assistant" --web-dir="dist"
          npx cap add android
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: |
          chmod +x android/gradlew

      - name: Build APK with Gradle (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK File to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yesmin-AI-GalaxyTab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
